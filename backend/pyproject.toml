[project]
name = "auto-insurance-premium-ml-backend"
version = "0.1.0"
description = "Backend services and ML utilities for the Auto Insurance Premium Regression Lab."
# Targets Python 3.13 explicitly while remaining open to minor patch updates
requires-python = ">=3.13,<3.15"
dependencies = [
    "pandas==2.2.3",
    "numpy==2.1.3",
    "scikit-learn==1.6.1",
    "xgboost==2.1.4",
    "fastapi==0.115.12",
    "uvicorn[standard]==0.34.0",
    "pydantic==2.12.0",
    "joblib==1.4.2",
    "matplotlib==3.10.3",
    "seaborn==0.13.2",
    "pyyaml==6.0.2",
    "pytest==8.3.5",
]

[tool.uv]
package = false
